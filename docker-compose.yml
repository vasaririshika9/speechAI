version: '3.8'

# Speech Diagnosis - Contrastive Speech Analytics & Temporal Flaw Grounding
# Day 1 Docker Compose skeleton. Full containerization planned for subsequent phases.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=sqlite:///./speech_diagnosis.db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
